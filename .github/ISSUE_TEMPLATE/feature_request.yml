name: "✨ Feature request"
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do, and where does CodeMaestro get in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what you'd like to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Prompt Builder
        - Library / Templates
        - Playground
        - Knowledge Base (RAG)
        - Code Assistant
        - Multi-Model Orchestrator
        - Providers / Settings
        - Other
    validations:
      required: true
